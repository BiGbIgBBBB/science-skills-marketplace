name: Sync upstream skills

on:
  schedule:
    - cron: "17 7 * * *"   # daily, 07:17 UTC
  workflow_dispatch:
  push:
    paths: ["sources.json", "scripts/sync.py"]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync skills from upstream
        run: python3 scripts/sync.py
      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No upstream changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream skills ($(date -u +%Y-%m-%d))"
          git push
